server:
  port: 8080

spring:
  application:
    name: shopstream-marketplace
  
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/shopstream
    username: shopstream
    password: shopstream123
    driver-class-name: org.postgresql.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # MongoDB Configuration
  data:
    mongodb:
      uri: mongodb://localhost:27017/shopstream
  
  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    password: 
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# JWT Configuration
jwt:
  secret: mySecretKey123456789012345678901234567890
  expiration: 86400000 # 24 hours in milliseconds

# Logging
logging:
  level:
    com.shopstream.marketplace: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: DEBUG
