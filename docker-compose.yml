services:
  postgres:
    image: postgres:15
    container_name: shopstream-postgres
    environment:
      POSTGRES_DB: shopstream
      POSTGRES_USER: shopstream
      POSTGRES_PASSWORD: shopstream123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopstream-network

  mongodb:
    image: mongo:7
    container_name: shopstream-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - shopstream-network

  redis:
    image: redis:7-alpine
    container_name: shopstream-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shopstream-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: shopstream-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - shopstream-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: shopstream-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - shopstream-network

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: shopstream-kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: -Xms32M -Xmx64M
      SERVER_SERVLET_CONTEXTPATH: /
    networks:
      - shopstream-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: shopstream-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=shopstream-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - shopstream-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: shopstream-kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    networks:
      - shopstream-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopstream-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopstream
      SPRING_DATASOURCE_USERNAME: shopstream
      SPRING_DATASOURCE_PASSWORD: shopstream123
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/shopstream
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      - postgres
      - mongodb
      - redis
      - kafka
      - elasticsearch
    networks:
      - shopstream-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopstream-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - shopstream-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  elasticsearch_data:

networks:
  shopstream-network:
    driver: bridge